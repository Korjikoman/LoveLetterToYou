<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (
        title='Edit Letter',
        content=~{::content},
        styles=~{::styles},
        scripts=~{::scripts}
      )}">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="/css/create_letter.css">
    </th:block>
</head>

<body>
<th:block th:fragment="content">
    <section class="letter-editor" aria-labelledby="edit-letter-title">
        <div class="letter-card">
            <div class="editor-heading">
                <span class="editor-heading-icon" aria-hidden="true">✏️</span>
                <h1 id="edit-letter-title">Polish your letter</h1>
                <p>A tiny edit can make a heartfelt note feel just right.</p>
            </div>

            <input type="hidden" id="publicToken" th:value="${letterPublicToken}">

            <div class="letter-form">
                <div class="form-group">
                    <label class="form-label" for="letterTitle">Letter title</label>
                    <input type="text"
                           id="letterTitle"
                           class="letter-title"
                           th:value="${letterTitle}"
                           maxlength="120"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="letterContent">Your message</label>
                    <textarea id="letterContent"
                              required
                              th:text="${letterText}"></textarea>
                </div>

                <div class="options-grid">
                    <div class="form-group slider-group">
                        <label for="livingTime">
                            Keep this letter alive for
                            <span class="time-readout"><span id="livingTimeValue" th:text="${letterTTL}">60</span>&nbsp;min</span>
                        </label>
                        <input type="range"
                               id="livingTime"
                               min="1"
                               max="1440"
                               th:value="${letterTTL}">
                    </div>

                    <div class="form-group protection-panel">
                        <label class="checkbox-label" for="protectedLetter">
                            <input type="checkbox"
                                   id="protectedLetter"
                                   aria-controls="passwordContainer"
                                   th:checked="${letterPassword != null and !#strings.isEmpty(letterPassword)}">
                            <span>Lock with a new code</span>
                        </label>
                    </div>
                </div>

                <div class="form-group password-block"
                     id="passwordContainer"
                     th:style="${letterPassword != null and !#strings.isEmpty(letterPassword)} ? 'display:flex' : 'display:none'">
                    <label>New 5-character code <span class="label-note">letters + numbers</span></label>
                    <div id="passwordInputs" aria-label="Five-character letter password">
                        <input class="password-char" maxlength="1" aria-label="Password character 1">
                        <input class="password-char" maxlength="1" aria-label="Password character 2">
                        <input class="password-char" maxlength="1" aria-label="Password character 3">
                        <input class="password-char" maxlength="1" aria-label="Password character 4">
                        <input class="password-char" maxlength="1" aria-label="Password character 5">
                    </div>
                </div>
            </div>

            <div class="btn-container">
                <button type="button" id="saveButton" class="btn-small">
                    <span>Save changes</span><span aria-hidden="true">💾</span>
                </button>
                <a th:href="@{/letters/get}" class="btn-small secondary">
                    <span>Cancel</span>
                </a>
            </div>

            <div id="messageContainer" role="status" aria-live="polite"></div>
        </div>
    </section>
</th:block>

<th:block th:fragment="scripts">
<script>
    let letterTTL = Number(document.getElementById('livingTime').value);
    let letterPassword = null;

    const livingTimeSlider = document.getElementById('livingTime');
    const livingTimeValue = document.getElementById('livingTimeValue');
    const protectedCheckbox = document.getElementById('protectedLetter');
    const passwordContainer = document.getElementById('passwordContainer');
    const passwordInputs = document.querySelectorAll('.password-char');

    livingTimeSlider.addEventListener('input', () => {
        livingTimeValue.textContent = livingTimeSlider.value;
        letterTTL = Number(livingTimeSlider.value);
    });

    protectedCheckbox.addEventListener('change', () => {
        passwordContainer.style.display = protectedCheckbox.checked ? 'flex' : 'none';
        passwordInputs.forEach(i => i.value = '');
        letterPassword = null;
    });

    passwordInputs.forEach((input, idx) => {
        input.addEventListener('input', () => {
            if (input.value && idx < 4) passwordInputs[idx + 1].focus();
            const pass = Array.from(passwordInputs).map(i => i.value).join('');
            letterPassword = /^[A-Za-z0-9]{5}$/.test(pass) ? pass : null;
        });
    });

    document.getElementById('saveButton').addEventListener('click', () => {
        const payload = {
            title: document.getElementById('letterTitle').value.trim(),
            text: document.getElementById('letterContent').value.trim(),
            ttl: letterTTL,
            password: letterPassword
        };

        const token = document.getElementById('publicToken').value;

        csrfFetch(`/letters/edit?publicToken=${encodeURIComponent(token)}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(r => {
            if (r.ok) {
                window.location.href = '/letters/get?success=true';
            } else {
                showMsg('Error ✖', 'danger');
            }
        })
        .catch(() => showMsg('Network error', 'danger'));
    });

    function showMsg(msg, type) {
        const c = document.getElementById('messageContainer');
        c.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => c.innerHTML = '', 4000);
    }
</script>
</th:block>
</body>
</html>
