<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (
        title='Edit Letter',
        content=~{::content},
        styles=~{::styles},
        scripts=~{::scripts}
      )}">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="/css/create_letter.css">
    </th:block>
</head>

<body>
<th:block th:fragment="content">
    <section class="letter-editor" aria-labelledby="edit-letter-title">
        <div class="letter-card">
            <div class="editor-heading">
                <span class="editor-heading-icon" aria-hidden="true">✏️</span>
                <h1 id="edit-letter-title">Polish your letter</h1>
                <p>A tiny edit can make a heartfelt note feel just right.</p>
            </div>

            <input type="hidden" id="publicToken" th:value="${letterPublicToken}">
            <input type="hidden" id="letterVersion" th:value="${letterVersion}">
            <input type="hidden" id="letterBurnAfterOpening" th:value="${letterBurnAfterOpening}">
            <input type="hidden" id="fontPresent" th:value="${fontPresent}">
            <input type="hidden" id="fontBold" th:value="${fontBold}">
            <input type="hidden" id="fontCursive" th:value="${fontCursive}">
            <input type="hidden" id="fontUnderlined" th:value="${fontUnderlined}">
            <input type="hidden" id="fontFamily" th:value="${fontFamily}">
            <input type="hidden" id="fontName" th:value="${fontName}">
            <input type="hidden"
                   class="existing-reaction"
                   th:each="reaction : ${reactions}"
                   th:value="${reaction}">
            <div class="letter-form">
                <div class="form-group">
                    <label class="form-label" for="letterTitle">Letter title</label>
                    <input type="text"
                           id="letterTitle"
                           class="letter-title"
                           th:value="${letterTitle}"
                           maxlength="120"
                           required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="letterContent">Your message</label>
                    <textarea id="letterContent"
                              required
                              th:text="${letterText}"></textarea>
                </div>

                <div class="form-group image-upload-panel">
                    <label class="form-label" for="letterImages">Изображения</label>
                    <input id="letterImages"
                           class="image-file-input"
                           type="file"
                           accept="image/jpeg,image/png"
                           multiple>
                    <p class="label-note">Добавьте новые или удалите прикреплённые изображения. Максимум — 10.</p>
                    <div id="letterImageList" class="letter-image-list">
                        <article class="letter-image-item"
                                 data-ready="true"
                                 data-existing="true"
                                 th:each="image : ${images}"
                                 th:attr="data-image-id=${image.id}">
                            <img th:src="${image.contentUrl}" alt="Изображение письма">
                            <span>Прикреплено</span>
                            <button type="button"
                                    class="letter-image-remove"
                                    aria-label="Удалить изображение">Удалить</button>
                        </article>
                    </div>
                    <p id="letterImageStatus" class="image-upload-status" aria-live="polite"></p>
                </div>

                <div class="options-grid single-column">
                    <div class="form-group slider-group">
                        <label for="livingTime">
                            Keep this letter alive for
                            <span class="time-readout"><span id="livingTimeValue" th:text="${letterTTL}">60</span>&nbsp;min</span>
                        </label>
                        <input type="range"
                               id="livingTime"
                               min="5"
                               max="1440"
                               th:value="${letterTTL}">
                    </div>

                </div>
            </div>

            <div class="btn-container">
                <button type="button" id="saveButton" class="btn-small">
                    <span>Save changes</span><span aria-hidden="true">💾</span>
                </button>
                <a th:href="@{/letters/get}" class="btn-small secondary">
                    <span>Cancel</span>
                </a>
            </div>

            <div id="messageContainer" role="status" aria-live="polite"></div>
        </div>
    </section>
</th:block>

<th:block th:fragment="scripts">
<script src="/js/letter-images.js"></script>
<script>
    let letterTTL = Number(document.getElementById('livingTime').value);
    const livingTimeSlider = document.getElementById('livingTime');
    const livingTimeValue = document.getElementById('livingTimeValue');
    const imageManager = createLetterImageManager();

    livingTimeSlider.addEventListener('input', () => {
        livingTimeValue.textContent = livingTimeSlider.value;
        letterTTL = Number(livingTimeSlider.value);
    });

    document.getElementById('saveButton').addEventListener('click', async event => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
            await imageManager.waitUntilReady();
            const payload = {
                letterTitle: document.getElementById('letterTitle').value.trim(),
                letterText: document.getElementById('letterContent').value.trim(),
                ttl: letterTTL,
                burn_after_opening: document.getElementById('letterBurnAfterOpening').value === 'true',
                font: document.getElementById('fontPresent').value === 'true' ? {
                    isFontBold: document.getElementById('fontBold').value === 'true',
                    isFontCursive: document.getElementById('fontCursive').value === 'true',
                    isFontUnderlined: document.getElementById('fontUnderlined').value === 'true',
                    fontFamily: document.getElementById('fontFamily').value,
                    fontName: document.getElementById('fontName').value
                } : null,
                reactions: Array.from(document.querySelectorAll('.existing-reaction'))
                    .map(input => input.value),
                imageIds: imageManager.getImageIds(),
                expectedVersion: Number(document.getElementById('letterVersion').value)
            };

            const token = document.getElementById('publicToken').value;
            const response = await csrfFetch(
                `/letters/edit?publicToken=${encodeURIComponent(token)}`,
                {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                }
            );

            if (response.ok) {
                window.location.href = '/letters/get?success=true';
            } else {
                const body = await response.json().catch(() => ({}));
                throw new Error(body.error || 'Не удалось сохранить письмо');
            }
        } catch (error) {
            showMsg(error.message || 'Ошибка соединения', 'danger');
        } finally {
            button.disabled = false;
        }
    });

    function showMsg(msg, type) {
        const c = document.getElementById('messageContainer');
        c.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => c.innerHTML = '', 4000);
    }
</script>
</th:block>
</body>
</html>
