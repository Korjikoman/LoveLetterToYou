<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <title>Something lovely for you · Romantic Letters</title>
    <link rel="stylesheet" href="/css/watch_letter.css">
</head>
<body>
    <a th:href="@{/index}" class="logo" aria-label="Romantic Letters home">
        <span aria-hidden="true">💌</span> Romantic Letters
    </a>

    <div class="background-hearts" aria-hidden="true">
        <div class="heart" style="left:8%; animation-duration:18s;"></div>
        <div class="heart" style="left:23%; animation-duration:22s; animation-delay:-9s;"></div>
        <div class="heart" style="left:39%; animation-duration:20s; animation-delay:-14s;"></div>
        <div class="heart" style="left:55%; animation-duration:24s; animation-delay:-6s;"></div>
        <div class="heart" style="left:71%; animation-duration:19s; animation-delay:-12s;"></div>
        <div class="heart" style="left:87%; animation-duration:23s; animation-delay:-17s;"></div>
    </div>

    <main class="letter-container">
        <p class="letter-intro">
            A little something arrived for you&nbsp; ✨
            <span class="open-hint" id="open-hint">Click the envelope to open it</span>
        </p>

        <div class="envelope-stage">
            <div class="envelope is-closed"
                 id="letter-envelope"
                 role="button"
                 tabindex="0"
                 aria-expanded="false"
                 aria-describedby="open-hint"
                 aria-label="Open your romantic letter">
                <article class="letter-card" aria-label="Your romantic letter" aria-hidden="true">
                    <h2 data-animate-letters th:text="${letterTitle}">A heartfelt letter</h2>
                    <p data-animate-letters th:text="${letterText}">Your letter appears here.</p>
                    <div class="public-letter-images" th:if="${!#lists.isEmpty(images)}">
                        <img th:each="image : ${images}"
                             th:src="@{/watch/letter/{token}/images/{id}(token=${publicToken},id=${image.id},key=${securityKey})}"
                             alt="Изображение из письма"
                             loading="lazy">
                    </div>
                    <div class="author" data-animate-letters th:text="'— ' + ${authorName}">— With love</div>
                </article>

                <div class="envelope-hearts" aria-hidden="true">
                    <span class="envelope-heart heart-one"></span>
                    <span class="envelope-heart heart-two"></span>
                    <span class="envelope-heart heart-three"></span>
                </div>

                <div class="flap-top" aria-hidden="true">
                    <span class="seal">♥</span>
                </div>
                <div class="flap-left" aria-hidden="true"></div>
                <div class="flap-right" aria-hidden="true"></div>
                <div class="flap-bottom" aria-hidden="true"></div>
            </div>
        </div>

        <p class="sr-only" id="letter-status" aria-live="polite"></p>
    </main>

    <script src="/js/watch_letter.js"></script>
</body>
</html>
