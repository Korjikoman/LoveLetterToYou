<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (
        title='Home',
        content=~{::content},
        styles=~{},
        scripts=~{::scripts}
      )}">

<th:block th:fragment="content">
    <section class="welcome-stage" aria-labelledby="welcome-title">
        <div class="welcome-copy">
            <p class="eyebrow">A tiny home for enormous feelings</p>
            <h1 id="welcome-title">Words from the <em>heart</em></h1>
            <p class="welcome-lead">
                Some feelings are easier to write than to say. Wrap yours in a little
                digital letter, keep it safe, and share it with someone special.
            </p>
            <div class="welcome-actions">
                <a class="storybook-button" th:href="@{/create/letter}">
                    <span aria-hidden="true">✍️</span> Write a love letter
                </a>
                <a class="storybook-button secondary" th:href="@{/letters/get}">
                    <span aria-hidden="true">💌</span> Visit my letters
                </a>
            </div>
        </div>

        <div class="welcome-illustration" aria-hidden="true">
            <span class="doodle doodle-one">✨</span>
            <span class="doodle doodle-two">🌸</span>
            <span class="doodle doodle-three">💗</span>
            <div class="mailbox">
                <div class="mailbox-door">💌</div>
                <div class="mailbox-flag"></div>
            </div>
        </div>
    </section>
</th:block>

<th:block th:fragment="scripts"></th:block>
</html>
