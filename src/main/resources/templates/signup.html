<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Sign up · Romantic Letters</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/csrf.js"></script>
    <script src="/js/signup.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <a class="auth-brand" th:href="@{/index}">
        <span aria-hidden="true">💌</span>
        <span>Romantic Letters</span>
    </a>

    <div class="auth-sparkles" aria-hidden="true">
        <span>✦</span><span>♥</span><span>✿</span><span>✧</span>
    </div>

    <section class="auth-shell" aria-labelledby="signup-title">
        <div class="auth-art" aria-hidden="true">
            <div class="envelope auth-envelope">
                <span class="flap-top"></span>
                <span class="flap-left"></span>
                <span class="flap-right"></span>
                <span class="flap-bottom"></span>
                <span class="auth-envelope-heart">♥</span>
            </div>
            <h2>Start your story</h2>
            <p>A cozy corner for every message that deserves to feel special.</p>
        </div>

        <div class="auth-card">
            <p class="auth-eyebrow">Join the sweetest post office</p>
            <h1 id="signup-title">Make your mailbox</h1>
            <p class="auth-intro">A few tiny details, then you can begin writing from the heart.</p>

            <div id="signup-status"
                 class="auth-message"
                 role="status"
                 aria-live="polite"
                 hidden></div>

            <form class="auth-form" id="signup-form">
                <div class="inputbox">
                    <label for="username">Username</label>
                    <div class="input-control">
                        <ion-icon name="person-outline" aria-hidden="true"></ion-icon>
                        <input type="text"
                               id="username"
                               name="username"
                               autocomplete="username"
                               minlength="2"
                               maxlength="100"
                               required>
                    </div>
                </div>

                <div class="inputbox">
                    <label for="email">Email address</label>
                    <div class="input-control">
                        <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
                        <input type="email"
                               id="email"
                               name="email"
                               autocomplete="email"
                               maxlength="320"
                               required>
                    </div>
                </div>

                <div class="inputbox">
                    <label for="password">Password</label>
                    <div class="input-control">
                        <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
                        <input type="password"
                               id="password"
                               name="password"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="72"
                               required>
                    </div>
                </div>

                <div class="inputbox">
                    <label for="passwordcon">Repeat password</label>
                    <div class="input-control">
                        <ion-icon name="shield-checkmark-outline" aria-hidden="true"></ion-icon>
                        <input type="password"
                               id="passwordcon"
                               name="passwordcon"
                               autocomplete="new-password"
                               minlength="8"
                               maxlength="72"
                               required>
                    </div>
                </div>

                <button class="auth-submit" id="submit" type="submit">Create my account <span aria-hidden="true">→</span></button>
            </form>

            <div class="register">
                <p>Already have a mailbox? <a th:href="@{/req/login}">Log in</a></p>
            </div>
        </div>
    </section>

<script>
    const signupForm = document.getElementById('signup-form');
    const submitButton = document.getElementById("submit");
    const signupStatus = document.getElementById('signup-status');

    function showSignupStatus(message, type) {
        signupStatus.textContent = message;
        signupStatus.className = `auth-message auth-message--${type}`;
        signupStatus.hidden = false;
    }

    signupForm.addEventListener('submit', async event => {
        event.preventDefault();

        if (!signupForm.reportValidity()) {
            return;
        }

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('passwordcon').value;
        const email = document.getElementById('email').value.trim();

        if (password !== confirmPassword) {
            showSignupStatus('Passwords do not match. Please try again.', 'error');
            return;
        }

        submitButton.disabled = true;
        signupStatus.hidden = true;

        try {
            const response = await csrfFetch('/req/signup', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password, email })
            });

            if (!response.ok) {
                const details = await response.text();
                showSignupStatus(
                    details || 'Could not create the account. Check your details.',
                    'error'
                );
                return;
            }

            showSignupStatus(
                '✨ Your mailbox is ready! Taking you to sign in…',
                'success'
            );

            window.setTimeout(() => {
                window.location.assign('/req/login');
            }, 1200);
        } catch (error) {
            console.error('Registration request failed:', error);
            showSignupStatus(
                'Could not reach the server. Please try again.',
                'error'
            );
        } finally {
            submitButton.disabled = false;
        }
    });
</script>
</body>
</html>
