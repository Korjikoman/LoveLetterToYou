<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, content, styles, scripts)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${title} + ' · Romantic Letters'">Romantic Letters</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Great+Vibes&amp;family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/theme.css">

    <script src="/js/csrf.js"></script>
    <th:block th:replace="${styles} ?: ~{}"></th:block>
</head>

<body>
<a class="skip-link" href="#main-content">Skip to the lovely stuff</a>

<div class="background-hearts" aria-hidden="true">
    <div class="heart" style="left:8%; animation-duration:18s;"></div>
    <div class="heart" style="left:19%; animation-duration:23s; animation-delay:-8s;"></div>
    <div class="heart" style="left:31%; animation-duration:20s; animation-delay:-14s;"></div>
    <div class="heart" style="left:44%; animation-duration:25s; animation-delay:-5s;"></div>
    <div class="heart" style="left:57%; animation-duration:19s; animation-delay:-11s;"></div>
    <div class="heart" style="left:69%; animation-duration:24s; animation-delay:-17s;"></div>
    <div class="heart" style="left:81%; animation-duration:21s; animation-delay:-6s;"></div>
    <div class="heart" style="left:92%; animation-duration:26s; animation-delay:-19s;"></div>
</div>

<header class="site-header">
    <div class="brand-cluster">
        <a th:href="@{/index}" class="logo" aria-label="Romantic Letters home">
            <span class="logo-mark" aria-hidden="true">💌</span>
            <span>
                <span class="logo-text">Romantic Letters</span>
                <span id="usernameP" class="greeting" aria-live="polite">Welcome, daydreamer!</span>
            </span>
        </a>
    </div>

    <div class="status" aria-label="Live community activity">
        <div class="status-chip">
            <span class="status-icon" aria-hidden="true">🌷</span>
            <span>Hearts online</span>
            <strong id="usersOnlineCounter" aria-live="polite">—</strong>
        </div>
        <div class="status-chip">
            <span class="status-icon" aria-hidden="true">✏️</span>
            <span>Letters in bloom</span>
            <strong id="usersWritingLetterCounter" aria-live="polite">—</strong>
        </div>
    </div>
</header>

<nav class="site-nav" aria-label="Main navigation">
    <ul>
        <li><a th:href="@{/letters/get}"><span aria-hidden="true">📚</span> My Letters</a></li>
        <li><a id="createLetter" th:href="@{/create/letter}"><span aria-hidden="true">💖</span> Create Letter</a></li>
        <li><a th:href="@{/profile/get}"><span aria-hidden="true">🌼</span> My Profile</a></li>
        <li>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="logout-button" type="submit"><span aria-hidden="true">👋</span> Logout</button>
            </form>
        </li>
    </ul>
</nav>

<main id="main-content" class="site-main">
    <th:block th:replace="${content} ?: ~{}"></th:block>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<footer class="site-footer">
    <span><span aria-hidden="true">💗</span> Made for words worth keeping</span>
</footer>

<th:block th:replace="${scripts}"> </th:block>
<script>
    ws = new WebSocket("ws://"+ location.host+"/ws");
        ws.onopen = () => {
            console.log("WebSocket Connected Successfully");
        }
        ws.onmessage = (event) => {
            console.log("Message from server: ", event.data);
            var obj = JSON.parse(event.data);

            document.getElementById("usersOnlineCounter").innerText = obj.usersOnline;
            document.getElementById("usersWritingLetterCounter").innerText = obj.usersWritingLetter;
            document.getElementById("usernameP").innerText = 'Hello, ' + obj.username;
        }

        ws.onclose = () => {
            console.log("WebSocket Disconnected")
        }
    setInterval(() => {
        csrfFetch("/api/user/user-is-online", {method: "POST"});
    }, 59000);
</script>
</body>
</html>
