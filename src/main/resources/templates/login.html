<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <title>Log in · Romantic Letters</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/signup.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <a class="auth-brand" th:href="@{/index}">
        <span aria-hidden="true">💌</span>
        <span>Romantic Letters</span>
    </a>

    <div class="auth-sparkles" aria-hidden="true">
        <span>✦</span><span>♥</span><span>✿</span><span>✧</span>
    </div>

    <section class="auth-shell" aria-labelledby="login-title">
        <div class="auth-art" aria-hidden="true">
            <div class="auth-envelope">
                <span class="auth-envelope-heart">💗</span>
            </div>
            <h2>A note just for you</h2>
            <p>Your sweetest words are waiting safely inside.</p>
        </div>

        <div class="auth-card">
            <p class="auth-eyebrow">Lovely to see you again</p>
            <h1 id="login-title">Welcome back!</h1>
            <p class="auth-intro">Open the door to your little collection of heartfelt notes.</p>

            <form class="auth-form" method="post" th:action="@{/req/login}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="inputbox">
                    <label for="email">Email address</label>
                    <div class="input-control">
                        <ion-icon name="mail-outline" aria-hidden="true"></ion-icon>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                </div>

                <div class="inputbox">
                    <label for="password">Password</label>
                    <div class="input-control">
                        <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                </div>

                <button class="auth-submit" type="submit">Open my letters <span aria-hidden="true">→</span></button>
            </form>

            <div class="register">
                <p>New to our little post office? <a th:href="@{/req/signup}">Create an account</a></p>
            </div>
        </div>
    </section>
</body>
</html>
