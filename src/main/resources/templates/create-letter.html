<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (
        title='Create Letter',
        content=~{::content},
        styles=~{::styles},
        scripts=~{::scripts}
      )}">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="/css/create_letter.css">
        <link rel="stylesheet" href="/css/modal_url.css">
    </th:block>
</head>

<body>
<th:block th:fragment="content">
    <section class="letter-editor" aria-labelledby="create-letter-title">
        <div class="letter-card">
            <div class="editor-heading">
                <span class="editor-heading-icon" aria-hidden="true">💌</span>
                <h1 id="create-letter-title">Write your letter</h1>
                <p>Turn a quiet feeling into something they can keep.</p>
            </div>

            <form class="letter-form" th:action="@{/create/letter}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="letterTitle">A title for your note</label>
                    <input
                        type="text"
                        id="letterTitle"
                        name="title"
                        class="letter-title"
                        placeholder="For the one who makes me smile…"
                        maxlength="120"
                        autocomplete="off"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="letterContent">
                        Your heartfelt message
                        <span class="label-note">— take all the space you need</span>
                    </label>
                    <textarea
                        id="letterContent"
                        name="content"
                        placeholder="My dearest love, 💕&#10;&#10;Today I want to tell you...&#10;&#10;With all my heart,"
                        required></textarea>
                </div>

                <div class="form-group image-upload-panel">
                    <label class="form-label" for="letterImages">Изображения</label>
                    <input id="letterImages"
                           class="image-file-input"
                           type="file"
                           accept="image/jpeg,image/png"
                           multiple>
                    <p class="label-note">До 10 изображений JPEG или PNG, каждое не больше 10 МБ.</p>
                    <div id="letterImageList" class="letter-image-list"></div>
                    <p id="letterImageStatus" class="image-upload-status" aria-live="polite"></p>
                </div>

                <div class="options-grid single-column">
                    <div class="form-group slider-group">
                        <label for="livingTime">
                            Keep this letter alive for
                            <span class="time-readout"><span id="livingTimeValue">60</span>&nbsp;min</span>
                        </label>
                        <input type="range" id="livingTime" name="livingTime" min="5" max="1440" value="60">
                    </div>

                </div>
            </form>

            <div class="btn-container">
                <button type="button" id="createButtonSendLoveLetter" class="btn-small">
                    <span>Share your love letter</span><span aria-hidden="true">💝</span>
                </button>
                <a id="cancelButton" class="btn-small secondary" th:href="@{/index}">
                    <span>Cancel</span>
                </a>
            </div>

            <p class="editor-note">✨ Your words will be kept safe in our little digital heart ✨</p>
        </div>
    </section>
</th:block>

<th:block th:fragment="scripts">
    <script src="/js/letter-images.js"></script>
    <script>
        let letterTTL = 60;
        const livingTimeSlider = document.getElementById('livingTime');
        const livingTimeValue = document.getElementById('livingTimeValue');
        const imageManager = createLetterImageManager();

        // Слайдер
        livingTimeSlider.addEventListener('input', () => {
            livingTimeValue.textContent = livingTimeSlider.value;
            letterTTL = Number(livingTimeSlider.value);
        });

        const createLetterButton = document.getElementById("createButtonSendLoveLetter");

        createLetterButton.addEventListener('click', async () => {
            const letterContent = document.getElementById('letterContent');
            const letterText = letterContent.value.trim();
            const title = document.getElementById('letterTitle').value.trim();
            if (!title || !letterText) {
                alert('Заполните название и текст письма');
                return;
            }

            createLetterButton.disabled = true;
            try {
                await imageManager.waitUntilReady();
                const payload = {
                    letterTitle: title,
                    letterText,
                    ttl: letterTTL,
                    burn_after_opening: false,
                    font: null,
                    reactions: [],
                    imageIds: imageManager.getImageIds()
                };

                const response = await csrfFetch('/create/letter', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(data.error || 'Не удалось создать письмо');
                }

                const letterUrl = new URL(
                    `/watch/letter/${encodeURIComponent(data.publicToken)}`,
                    window.location.origin
                );
                await showSuccessModal(letterUrl.toString(), data.securityKey);
            } catch (error) {
                alert(error.message || 'Ошибка соединения');
            } finally {
                createLetterButton.disabled = false;
            }
        });

        async function showSuccessModal(letterUrl, securityKey) {
            const response = await csrfFetch('/create/letter/geturl');
            if (!response.ok) throw new Error('Не удалось открыть данные письма');
            document.body.insertAdjacentHTML('beforeend', await response.text());
            document.getElementById('letterUrl').value = letterUrl;
            document.getElementById('letterSecurityKey').value = securityKey;
        }

        setInterval(() => {
            csrfFetch("/api/letter/heartbeat-writing-letter", {method : "POST"});
        }, 5000);
    </script>
    <script>
        // Keeps the dynamically loaded share dialog comfortable for keyboard users.
        function enableShareDialogKeyboardSupport() {
            let returnFocusTarget = null;

            function closeShareDialog() {
                const dialog = document.querySelector('.modal-overlay');
                if (!dialog) return;

                dialog.remove();
                document.body.classList.remove('modal-open');
                returnFocusTarget?.focus();
            }

            function prepareShareDialog(dialog) {
                if (dialog.dataset.keyboardReady === 'true') return;

                dialog.dataset.keyboardReady = 'true';
                returnFocusTarget = document.activeElement;
                document.body.classList.add('modal-open');
                dialog.querySelector('.modal-close')?.focus();
            }

            new MutationObserver(() => {
                const dialog = document.querySelector('.modal-overlay');
                if (dialog) prepareShareDialog(dialog);
            }).observe(document.body, {childList: true});

            document.addEventListener('click', event => {
                if (event.target.closest('.modal-close')) closeShareDialog();
            });

            document.addEventListener('keydown', event => {
                const dialog = document.querySelector('.modal-overlay');
                if (!dialog) return;

                if (event.key === 'Escape') {
                    closeShareDialog();
                    return;
                }

                if (event.key !== 'Tab') return;

                const focusable = [...dialog.querySelectorAll('button, a[href], input:not([disabled])')];
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            });
        }

        enableShareDialogKeyboardSupport();
    </script>
</th:block>
</body>
</html>
