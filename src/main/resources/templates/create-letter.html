<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout (
        title='Create Letter',
        content=~{::content},
        styles=~{::styles},
        scripts=~{::scripts}
      )}">
<head>
    <th:block th:fragment="styles">
        <link rel="stylesheet" href="/css/create_letter.css">
        <link rel="stylesheet" href="/css/modal_url.css">
    </th:block>
</head>

<body>
<th:block th:fragment="content">
    <section class="letter-editor" aria-labelledby="create-letter-title">
        <div class="letter-card">
            <div class="editor-heading">
                <span class="editor-heading-icon" aria-hidden="true">💌</span>
                <h1 id="create-letter-title">Write your letter</h1>
                <p>Turn a quiet feeling into something they can keep.</p>
            </div>

            <form class="letter-form" th:action="@{/create/letter}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="letterTitle">A title for your note</label>
                    <input
                        type="text"
                        id="letterTitle"
                        name="title"
                        class="letter-title"
                        placeholder="For the one who makes me smile…"
                        maxlength="120"
                        autocomplete="off"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="letterContent">
                        Your heartfelt message
                        <span class="label-note">— take all the space you need</span>
                    </label>
                    <textarea
                        id="letterContent"
                        name="content"
                        placeholder="My dearest love, 💕&#10;&#10;Today I want to tell you...&#10;&#10;With all my heart,"
                        required></textarea>
                </div>

                <div class="options-grid">
                    <div class="form-group slider-group">
                        <label for="livingTime">
                            Keep this letter alive for
                            <span class="time-readout"><span id="livingTimeValue">60</span>&nbsp;min</span>
                        </label>
                        <input type="range" id="livingTime" name="livingTime" min="5" max="1440" value="60">
                    </div>

                    <div class="form-group protection-panel">
                        <label class="checkbox-label" for="protectedLetter">
                            <input type="checkbox" id="protectedLetter" aria-controls="passwordContainer">
                            <span>Lock with a secret code</span>
                        </label>
                    </div>
                </div>

                <div class="form-group password-block" id="passwordContainer">
                    <label>Make a 5-character code <span class="label-note">letters + numbers</span></label>
                    <div id="passwordInputs" aria-label="Five-character letter password">
                        <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 1">
                        <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 2">
                        <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 3">
                        <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 4">
                        <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 5">
                    </div>
                    <button type="button" id="setPasswordButton">Seal this code <span aria-hidden="true">🔒</span></button>
                </div>
            </form>

            <div class="btn-container">
                <button type="button" id="createButtonSendLoveLetter" class="btn-small">
                    <span>Share your love letter</span><span aria-hidden="true">💝</span>
                </button>
                <a id="cancelButton" class="btn-small secondary" th:href="@{/index}">
                    <span>Cancel</span>
                </a>
            </div>

            <p class="editor-note">✨ Your words will be kept safe in our little digital heart ✨</p>
        </div>
    </section>
</th:block>

<th:block th:fragment="scripts">
    <script>
        
        let letterPassword = ""; // сюда сохраняем пароль после нажатия Set Password
        let letterTTL = 60;      // начальное время в минутах

        const setPasswordButton = document.getElementById('setPasswordButton');
        const passwordInputs = document.querySelectorAll('.password-char');
        const livingTimeSlider = document.getElementById('livingTime');
        const livingTimeValue = document.getElementById('livingTimeValue');

        const protectedCheckbox = document.getElementById('protectedLetter');
        const passwordContainer = document.getElementById('passwordContainer');

        protectedCheckbox.addEventListener('change', () => {
            passwordContainer.style.display = protectedCheckbox.checked ? 'flex' : 'none';
            setPasswordButton.style.display = 'none';
            passwordInputs.forEach(input => input.value = '');
        });

        passwordInputs.forEach((input, idx) => {
            input.addEventListener('input', () => {
                if (input.value.length === 1 && idx < passwordInputs.length - 1) {
                    passwordInputs[idx + 1].focus();
                }
                validatePassword();
            });
        });

        function validatePassword() {
            const password = Array.from(passwordInputs).map(i => i.value).join('');
            const regex = /^[A-Za-z0-9]{5}$/;
            setPasswordButton.style.display = regex.test(password) ? 'inline-block' : 'none';
        }

        // Слайдер
        livingTimeSlider.addEventListener('input', () => {
            livingTimeValue.textContent = livingTimeSlider.value;
            letterTTL = Number(livingTimeSlider.value);
        });

        setPasswordButton.addEventListener('click', () => {
            letterPassword = Array.from(passwordInputs).map(i => i.value).join('');
            alert("Password set!");
        });

        // NIGAAAAAAAAAAAAAAAAAAAAAA 
        const createLetterButton = document.getElementById("createButtonSendLoveLetter");

        createLetterButton.addEventListener('click', () => {
            const letterContent = document.getElementById('letterContent');
            const letterText = letterContent.value.trim();
            const title = document.getElementById('letterTitle').value.trim();
            if (!letterText) {
                alert('Please fill this letter with magic of love 💕');
                letterContent.focus();
                return;
            }

            const payload = {
                title: title,
                text: letterText,
                password: letterPassword || null, // если пароль не установлен — null
                ttl: letterTTL // время жизни письма в минутах
            };

            csrfFetch('/create/letter', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => response.text())
            .then(data => {
                showSuccessModal(data);
                // Очистка переменных после отправки
                letterPassword = "";
                letterTTL = 60;
            })
            .catch(() => {
                alert('Network error 🥀');
            });
        });

        function showSuccessModal(letterUrl) {
            csrfFetch("/create/letter/geturl")
            .then(response => response.text())
            .then(html => {
                document.body.insertAdjacentHTML('beforeend', html);
                document.getElementById('letterUrl').value = letterUrl;
            })
            .catch(() => {
                alert('Cannot load modal :(');
            })
            
        }

        setInterval(() => {
            csrfFetch("/api/letter/heartbeat-writing-letter", {method : "POST"});
        }, 5000)


        

    </script>
    <script>
        // Keeps the dynamically loaded share dialog comfortable for keyboard users.
        function enableShareDialogKeyboardSupport() {
            let returnFocusTarget = null;

            function closeShareDialog() {
                const dialog = document.querySelector('.modal-overlay');
                if (!dialog) return;

                dialog.remove();
                document.body.classList.remove('modal-open');
                returnFocusTarget?.focus();
            }

            function prepareShareDialog(dialog) {
                if (dialog.dataset.keyboardReady === 'true') return;

                dialog.dataset.keyboardReady = 'true';
                returnFocusTarget = document.activeElement;
                document.body.classList.add('modal-open');
                dialog.querySelector('.modal-close')?.focus();
            }

            new MutationObserver(() => {
                const dialog = document.querySelector('.modal-overlay');
                if (dialog) prepareShareDialog(dialog);
            }).observe(document.body, {childList: true});

            document.addEventListener('click', event => {
                if (event.target.closest('.modal-close')) closeShareDialog();
            });

            document.addEventListener('keydown', event => {
                const dialog = document.querySelector('.modal-overlay');
                if (!dialog) return;

                if (event.key === 'Escape') {
                    closeShareDialog();
                    return;
                }

                if (event.key !== 'Tab') return;

                const focusable = [...dialog.querySelectorAll('button, a[href], input:not([disabled])')];
                const first = focusable[0];
                const last = focusable[focusable.length - 1];

                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault();
                    last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault();
                    first.focus();
                }
            });
        }

        enableShareDialogKeyboardSupport();
    </script>
</th:block>
</body>
</html>
