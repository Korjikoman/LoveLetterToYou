<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <title>Unlock letter · Romantic Letters</title>
    <link rel="stylesheet" href="/css/confirm-password.css">
</head>
<body>
<a class="mini-brand" th:href="@{/index}">
    <span aria-hidden="true">💌</span> Romantic Letters
</a>

<div class="password-doodles" aria-hidden="true">
    <span>✨</span><span>🔑</span><span>💗</span><span>🌸</span>
</div>

<main class="letter-container">
    <section class="letter-card" aria-labelledby="unlock-title">
        <div class="lock-stamp" aria-hidden="true">🔒</div>
        <h1 id="unlock-title">A secret letter</h1>
        <p>This note is wrapped in a little secret. Enter its five-character code to open it.</p>

        <form method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="password-label" for="password-char-1">Secret code</label>
            <div id="passwordInputs" class="password-inputs">
                <input id="password-char-1" type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 1" autocomplete="off">
                <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 2" autocomplete="off">
                <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 3" autocomplete="off">
                <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 4" autocomplete="off">
                <input type="text" maxlength="1" pattern="[A-Za-z0-9]" class="password-char" aria-label="Password character 5" autocomplete="off">
            </div>
            <button type="submit" class="btn-small">Open this letter <span aria-hidden="true">💌</span></button>
            <p th:if="${error}" class="error-msg" th:text="${error}" role="alert"></p>
        </form>
    </section>
</main>

<script>
    const passwordInputs = document.querySelectorAll('.password-char');
    const form = document.querySelector('form');

    passwordInputs.forEach((input, idx) => {
        input.addEventListener('input', () => {
            if(input.value.length === 1 && idx < passwordInputs.length - 1){
                passwordInputs[idx+1].focus();
            }
        });
    });

    form.addEventListener('submit', e => {
        const password = Array.from(passwordInputs).map(i => i.value).join('');
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'password';
        hiddenInput.value = password;
        e.target.appendChild(hiddenInput);
    });
</script>
</body>
</html>
