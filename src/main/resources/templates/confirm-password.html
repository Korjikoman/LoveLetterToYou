<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <title>Unlock letter · Romantic Letters</title>
    <link rel="stylesheet" href="/css/confirm-password.css">
</head>
<body>
<a class="mini-brand" th:href="@{/index}">
    <span aria-hidden="true">💌</span> Romantic Letters
</a>

<div class="password-doodles" aria-hidden="true">
    <span>✨</span><span>🔑</span><span>💗</span><span>🌸</span>
</div>

<main class="letter-container">
    <section class="letter-card" aria-labelledby="unlock-title">
        <div class="lock-stamp" aria-hidden="true">🔑</div>
        <h1 id="unlock-title">Письмо защищено</h1>
        <p>Введите секретный ключ, который отправитель передал вместе со ссылкой.</p>

        <form method="post" th:action="@{/watch/letter/{token}(token=${publicToken})}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="password-label" for="securityKey">Секретный ключ</label>
            <input id="securityKey"
                   type="text"
                   name="key"
                   maxlength="128"
                   required
                   autocomplete="off"
                   spellcheck="false">
            <button type="submit" class="btn-small">Открыть письмо <span aria-hidden="true">💌</span></button>
            <p th:if="${error}" class="error-msg" th:text="${error}" role="alert"></p>
        </form>
    </section>
</main>

</body>
</html>
