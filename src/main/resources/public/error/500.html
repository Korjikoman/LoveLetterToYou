<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cdbdf4">
    <title>500 · Delivery hiccup</title>
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-500">
    <div class="error-doodles" aria-hidden="true">
        <span>🛠️</span><span>✦</span><span>💜</span><span>⚙️</span>
    </div>

    <main class="error-card">
        <div class="error-illustration" aria-hidden="true">
            <span class="question-mark">!</span>
            <div class="envelope lost-envelope">
                <span class="flap-top"></span>
                <span class="flap-left"></span>
                <span class="flap-right"></span>
                <span class="flap-bottom"></span>
                <span class="lost-envelope-face"></span>
            </div>
            <span class="tiny-cloud">☁</span>
        </div>

        <div class="error-copy">
            <p class="error-code">500</p>
            <p class="error-kicker">A tiny delivery hiccup</p>
            <h1>Our mailroom needs a moment</h1>
            <p class="error-message">
                Something unexpected ruffled the envelopes. Please head home and try
                again in a little while—we’re putting every heart back in place.
            </p>
            <a class="home-button" href="/index"><span aria-hidden="true">🏡</span> Return home</a>
        </div>
    </main>
</body>
</html>
