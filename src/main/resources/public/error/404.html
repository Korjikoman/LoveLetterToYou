<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffd3e0">
    <title>404 · Letter not found</title>
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-404">
    <div class="error-doodles" aria-hidden="true">
        <span>✨</span><span>🌸</span><span>💗</span><span>✦</span>
    </div>

    <main class="error-card">
        <div class="error-illustration" aria-hidden="true">
            <span class="question-mark">?</span>
            <div class="envelope lost-envelope">
                <span class="flap-top"></span>
                <span class="flap-left"></span>
                <span class="flap-right"></span>
                <span class="flap-bottom"></span>
                <span class="lost-envelope-face"></span>
            </div>
            <span class="tiny-cloud">☁</span>
        </div>

        <div class="error-copy">
            <p class="error-code">404</p>
            <p class="error-kicker">This letter took a wrong turn</p>
            <h1>We can’t find that page</h1>
            <p class="error-message">
                It may have fluttered away, or the address might be a little mixed up.
                Your way back home is right here.
            </p>
            <a class="home-button" href="/index"><span aria-hidden="true">🏡</span> Return home</a>
        </div>
    </main>
</body>
</html>
