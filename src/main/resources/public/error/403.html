<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cfebdd">
    <title>403 · Letter unavailable</title>
    <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-403">
    <div class="error-doodles" aria-hidden="true">
        <span>🔒</span><span>✨</span><span>💌</span><span>🌿</span>
    </div>

    <main class="error-card">
        <div class="error-illustration" aria-hidden="true">
            <span class="question-mark">×</span>
            <div class="envelope lost-envelope">
                <span class="flap-top"></span>
                <span class="flap-left"></span>
                <span class="flap-right"></span>
                <span class="flap-bottom"></span>
                <span class="lost-envelope-face"></span>
            </div>
            <span class="tiny-cloud">🔒</span>
        </div>

        <div class="error-copy">
            <p class="error-code">403</p>
            <p class="error-kicker">This letter is no longer available</p>
            <h1>The envelope is closed</h1>
            <p class="error-message">
                This letter may have been deleted, expired, or you may not have
                permission to open it. Ask the sender for a new link and key.
            </p>
            <a class="home-button" href="/index"><span aria-hidden="true">🏡</span> Return home</a>
        </div>
    </main>
</body>
</html>
