spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
  properties:
    mail:
      debug: ${MAIL_DEBUG:false}
      smtp:
        auth: ${MAIL_AUTH:true}
        starttls:
          enable: ${MAIL_STARTTLS:true}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect 
    show-sql: true
  
server:
  host: ${MAIN_HOST}
  port: ${MAIN_PORT}

app:
  public-url: http://${MAIN_HOST}:${MAIN_PORT}